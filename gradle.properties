# Project-wide Gradle settings.
#
# To build for your own QuakeAlert server: set quakealert.base.url below or in local.properties.
# See docs/BUILDING.md for the self-hosting guide.

# QuakeAlert server base URL (history, sensors, ntfy, etc.). Default: official server.
quakealert.base.url=https://quakealert.web.id

org.gradle.jvmargs=-Xmx1536m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=false
android.builtInKotlin=false
android.newDsl=false
