name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug
        run: ./gradlew assembleFdroidDebug --no-daemon

      - name: Build release
        run: ./gradlew assembleFdroidRelease --no-daemon

      - name: Run unit tests
        run: ./gradlew testFdroidDebugUnitTest --no-daemon
